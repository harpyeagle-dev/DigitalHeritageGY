[info]
name = "Digital Heritage GY"
version = "0.1.0"
author = "Harpy Eagle Dev"
description = "An Omeka S theme for documenting, analysing, preserving, and teaching Guyana's cultural heritage."
theme_link = "https://github.com/harpyeagle-dev/DigitalHeritageGY"
author_link = "https://github.com/harpyeagle-dev"
omeka_version_constraint = "^4.2.0"

[config]

element_groups.identity = "Site Identity"
element_groups.navigation = "Navigation"
element_groups.display = "Display"
element_groups.footer = "Footer"

elements.logo.name = "logo"
elements.logo.type = "Omeka\Form\Element\Asset"
elements.logo.options.label = "Site Logo"
elements.logo.options.info = "Upload the Digital Heritage GY logo."
elements.logo.options.element_group = "identity"

elements.banner.name = "banner"
elements.banner.type = "Omeka\Form\Element\Asset"
elements.banner.options.label = "Site Banner"
elements.banner.options.info = "Upload an optional banner image for the site header."
elements.banner.options.element_group = "identity"

elements.nav_depth.name = "nav_depth"
elements.nav_depth.attributes.id = "nav_depth"
elements.nav_depth.type = "Number"
elements.nav_depth.options.label = "Navigation Depth"
elements.nav_depth.options.info = "Maximum number of navigation levels. Enter 0 to display all levels."
elements.nav_depth.options.element_group = "navigation"
elements.nav_depth.attributes.min = 0
elements.nav_depth.attributes.value = 2

elements.browse_body_truncation.name = "browse_body_truncation"
elements.browse_body_truncation.type = "Laminas\Form\Element\Select"
elements.browse_body_truncation.options.label = "Browse-page Text"
elements.browse_body_truncation.options.info = "Choose how long resource descriptions should appear on browse pages."
elements.browse_body_truncation.options.element_group = "display"
elements.browse_body_truncation.options.value_options.full = "Show the full value"
elements.browse_body_truncation.options.value_options.fade = "Show four lines and fade"
elements.browse_body_truncation.options.value_options.ellipsis = "Show four lines with an ellipsis"
elements.browse_body_truncation.attributes.value = "fade"

elements.footer.name = "footer"
elements.footer.attributes.id = "footer"
elements.footer.type = "Omeka\Form\Element\HtmlTextarea"
elements.footer.options.label = "Footer Content"
elements.footer.options.info = "Enter the content that should appear in the site footer."
elements.footer.options.element_group = "footer"
elements.footer.attributes.value = "<p>Digital Heritage GY — Community, research and learning through Guyana's cultural heritage.</p>"

resource_page_regions.items.main = "Main"
resource_page_regions.item_sets.main = "Main"
resource_page_regions.media.main = "Main"

resource_page_blocks.items.main[] = "mediaEmbeds"
resource_page_blocks.items.main[] = "values"
resource_page_blocks.items.main[] = "itemSets"
resource_page_blocks.items.main[] = "sitePages"
resource_page_blocks.items.main[] = "mediaList"
resource_page_blocks.items.main[] = "linkedResources"

resource_page_blocks.item_sets.main[] = "values"

resource_page_blocks.media.main[] = "mediaRender"
resource_page_blocks.media.main[] = "values"
