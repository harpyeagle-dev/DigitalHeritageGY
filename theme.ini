# Digital Heritage GY

Digital Heritage GY is an Omeka S 4.2 theme designed for documenting, preserving, analysing and teaching Guyana's cultural heritage.

## Modules

- Community Heritage
- Documentation
- Digital Humanities
- Computational Ethnomusicology
- Heritage Learning Hub
- Regional Music Curriculum

